x-app-db-environment: &app-db-environment
  PARTSOUQ_DB_HOST: mysql
  PARTSOUQ_DB_PORT: 3306
  PARTSOUQ_DB_NAME: ${PARTSOUQ_DB_NAME:-partsouq_catalog}
  PARTSOUQ_DB_USER: ${PARTSOUQ_DB_USER:-partsouq}
  PARTSOUQ_DB_PASSWORD: ${PARTSOUQ_DB_PASSWORD:?set PARTSOUQ_DB_PASSWORD in .env}

x-scheduler-environment: &scheduler-environment
  <<: *app-db-environment
  PARTSOUQ_HOME: /app
  PSQ_LIMIT_PARTS: "0"
  PSQ_BOUNDED_PARTS: "10000"
  PSQ_BOUNDED_BRAND: ${PSQ_BOUNDED_BRAND:-TOYOTA}
  PSQ_BOUNDED_MODEL: ${PSQ_BOUNDED_MODEL:-TACOMA}
  PSQ_VEHICLE_YEAR_WINDOW: ${PSQ_VEHICLE_YEAR_WINDOW:-20}
  PSQ_EVIDENCE_MAX_BODY_BYTES: "8388608"
  PSQ_EVIDENCE_MAX_RUN_BYTES: "1073741824"
  PSQ_EVIDENCE_MAX_ARTIFACTS: "50000"
  PSQ_SCHEDULER_STATE_DIR: /app/logs

x-scheduler-base: &scheduler-base
  build: .
  profiles: ["scheduler"]
  restart: unless-stopped
  stop_grace_period: 30s
  environment:
    <<: *scheduler-environment
  depends_on:
    mysql:
      condition: service_healthy
  entrypoint: ["partsouq-checked-entrypoint"]
  volumes:
    - ./output:/app/output
    - ./logs:/app/logs

services:
  mysql:
    image: mysql:8.4.11@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
    # migration 033 以低權限 app 帳號建立 deterministic trigger；MySQL 開啟
    # binary log 時必須顯式信任該類 trigger，否則會在 errno 1419 停住。
    command: ["--log-bin-trust-function-creators=1"]
    environment:
      MYSQL_DATABASE: ${PARTSOUQ_DB_NAME:-partsouq_catalog}
      MYSQL_USER: ${PARTSOUQ_DB_USER:-partsouq}
      MYSQL_PASSWORD: ${PARTSOUQ_DB_PASSWORD:?set PARTSOUQ_DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${PARTSOUQ_MYSQL_ROOT_PASSWORD:?set PARTSOUQ_MYSQL_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:${PARTSOUQ_DB_PORT:-3308}:3306"
    volumes:
      - partsouq_mysql:/var/lib/mysql
      - ./db/catalog.sql:/docker-entrypoint-initdb.d/10-catalog.sql:ro
      - ./db/nhtsa.sql:/docker-entrypoint-initdb.d/20-nhtsa.sql:ro
      - ./db/admin.sql:/docker-entrypoint-initdb.d/30-admin.sql:ro
      - ./db/station_admin.sql:/docker-entrypoint-initdb.d/40-station-admin.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 30

  admin:
    build: .
    environment:
      <<: *app-db-environment
      PARTSOUQ_HOME: /app
      PARTSOUQ_ADMIN_BIND_HOST: 0.0.0.0
      PARTSOUQ_ADMIN_TOKEN: ${PARTSOUQ_ADMIN_TOKEN:?set PARTSOUQ_ADMIN_TOKEN in .env}
      PARTSOUQ_ADMIN_TRUSTED_HOSTS: ${PARTSOUQ_ADMIN_TRUSTED_HOSTS:-127.0.0.1,localhost,admin.partsouq.localhost}
      PSQ_LIMIT_PARTS: "0"
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    entrypoint: ["partsouq-checked-entrypoint"]
    command: ["partsouq-admin"]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).close()",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s

  station-admin:
    build: .
    environment:
      <<: *app-db-environment
      PARTSOUQ_HOME: /app
      PARTSOUQ_STATION_ADMIN_SECRET_KEY: ${PARTSOUQ_STATION_ADMIN_SECRET_KEY:?set PARTSOUQ_STATION_ADMIN_SECRET_KEY in .env}
      PARTSOUQ_STATION_ADMIN_USERNAME: ${PARTSOUQ_STATION_ADMIN_USERNAME:?set PARTSOUQ_STATION_ADMIN_USERNAME in .env}
      PARTSOUQ_STATION_ADMIN_PASSWORD: ${PARTSOUQ_STATION_ADMIN_PASSWORD:?set PARTSOUQ_STATION_ADMIN_PASSWORD in .env}
      PARTSOUQ_STATION_ADMIN_REQUIRE_AUTH: "1"
      PARTSOUQ_STATION_ADMIN_ALLOWED_HOSTS: ${PARTSOUQ_STATION_ADMIN_ALLOWED_HOSTS:-localhost,127.0.0.1,admin.partsouq.localhost}
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "127.0.0.1:8086:8086"
    entrypoint: ["partsouq-checked-entrypoint"]
    command:
      [
        "gunicorn",
        "--bind",
        "0.0.0.0:8086",
        "--workers",
        "1",
        "partsouq_station_admin.wsgi:app",
      ]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import json,urllib.request; response=urllib.request.urlopen('http://127.0.0.1:8086/health', timeout=3); assert json.load(response).get('status') == 'ok'; response.close()",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s

  schema-migrate:
    build: .
    profiles: ["migration"]
    restart: "no"
    environment:
      <<: *app-db-environment
      PARTSOUQ_HOME: /app
    depends_on:
      mysql:
        condition: service_healthy
    command: ["partsouq-catalog-migrate", "apply"]

  scheduler:
    <<: *scheduler-base
    environment:
      <<: *scheduler-environment
      PSQ_CLOAK_STATE_DIR: /app/data
      # CloakBrowser transport（Linux arm64/x64 版本）：用本 image 內建的
      # python 與 Chromium binary；headless=False 需要 Xvfb 虛擬顯示。
      # server-args 含空白必須保持為單一參數（xvfb-run 才會正確解析），
      # 因此用單引號包住整個 -screen 規格。
      PSQ_CLOAK_PYTHON: /usr/local/bin/python
      PSQ_CLOAK_LAUNCHER: "xvfb-run -a --server-args='-screen 0 1366x900x24'"
      CLOAKBROWSER_CACHE_DIR: /app/.cloakbrowser
      # Linux CloakBrowser 以 Windows fingerprint 呈現 Chrome/146；
      # HTTP 請求必須用同一身分 UA，cf_clearance 才會成立。
      PSQ_CLOAK_USER_AGENT: >-
        Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36
        (KHTML, like Gecko) Chrome/146.0.0.0 Safari/537.36
    volumes:
      - ./output:/app/output
      - ./logs:/app/logs
      - ./data:/app/data
    command:
      [
        "partsouq-scheduler",
        "--job",
        "catalog",
        "--daemon",
        "--interval-seconds",
        "${SCHEDULER_CATALOG_INTERVAL_SECONDS:-2592000}",
      ]

  nhtsa-scheduler:
    <<: *scheduler-base
    command:
      [
        "partsouq-scheduler",
        "--job",
        "nhtsa",
        "--daemon",
        "--interval-seconds",
        "${SCHEDULER_NHTSA_INTERVAL_SECONDS:-86400}",
      ]

  queue-scheduler:
    <<: *scheduler-base
    command:
      [
        "partsouq-scheduler",
        "--job",
        "pending",
        "--daemon",
        "--interval-seconds",
        "${SCHEDULER_PENDING_INTERVAL_SECONDS:-30}",
      ]

volumes:
  partsouq_mysql:
